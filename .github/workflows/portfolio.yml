name: Portfolio validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          path: axiom-infra
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-rag
          path: axiom-rag
          ref: main
          ssh-key: ${{ secrets.PORTFOLIO_RAG_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-apex
          path: axiom-apex
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-ason
          path: axiom-ason
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-api
          path: axiom-api
          ref: main
          ssh-key: ${{ secrets.PORTFOLIO_API_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-demos
          path: axiom-demos
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-blender
          path: axiom-blender
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-llc.github.io
          path: axiom-llc.github.io
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-ops
          path: axiom-ops
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-research
          path: axiom-research
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-wiki-infinite
          path: axiom-wiki-infinite
          ref: main
          persist-credentials: false
      - name: Record validated revisions and verify credential cleanup
        run: |
          for repo in axiom-infra axiom-rag axiom-apex axiom-ason axiom-api axiom-blender axiom-demos axiom-llc.github.io axiom-ops axiom-research axiom-wiki-infinite; do
            echo "$repo $(git -C "$repo" rev-parse HEAD)"
            if git -C "$repo" config --local --name-only --get-regexp 'core\.sshcommand|http\..*\.extraheader'; then
              echo "::error::Checkout credentials remain configured in $repo"
              exit 1
            fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install matching portfolio wheels
        run: |
          python -m pip install setuptools wheel pytest responses
          python -m pip wheel --no-deps --no-build-isolation -w wheelhouse ./axiom-rag ./axiom-apex ./axiom-ason ./axiom-api
          python -m pip install wheelhouse/*.whl
          python -m pip install -r ./axiom-demos/voice-agent/requirements.txt
      - name: Test each repository in its own process
        run: |
          (cd axiom-rag && python -m pytest tests -q)
          (cd axiom-apex && python -m pytest tests -m 'not integration and not host_isolation' -q)
          (cd axiom-ason && python -m pytest ason/tests -q)
          (cd axiom-api && python -m pytest tests -q)
          (cd axiom-demos && python -m pytest tests -q)
      - name: Smoke test installed entry points outside source checkouts
        working-directory: ${{ runner.temp }}
        run: |
          rag
          apex --version
          ason
          python -c 'import cli, rag, apex, ason, server.app'
      - name: Emit canonical portfolio validation receipt
        if: matrix.python-version == '3.12'
        run: python axiom-infra/portfolio_receipt.py --allow-missing -o axiom-portfolio-validation.json
      - name: Upload canonical portfolio receipt
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-portfolio-validation
          path: axiom-portfolio-validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate local container integration
        if: matrix.python-version == '3.12'
        working-directory: axiom-infra
        env:
          GEMINI_API_KEY: offline-validation-only
          APEX_API_KEY: offline-validation-only
          RAG_API_TOKEN: offline-validation-only
        run: |
          docker compose config --quiet
          docker compose up --build --wait apex
          printf '%s' '{"plan":{"steps":[]}}' | docker compose run --rm -T ason submit -
      - name: Stop test containers
        if: always() && matrix.python-version == '3.12'
        working-directory: axiom-infra
        env:
          APEX_API_KEY: offline-validation-only
          RAG_API_TOKEN: offline-validation-only
        run: docker compose down
