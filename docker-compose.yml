services:
  apex:
    image: axiom-portfolio:local
    build:
      context: ..
      dockerfile: axiom-ason/Dockerfile
    command: ["apex", "serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APEX_API_KEY: ${APEX_API_KEY:?Set APEX_API_KEY before starting the stack}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - apex_data:/root/.apex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ason:
    image: axiom-portfolio:local
    profiles: ["tools"]
    entrypoint: ["ason"]
    command: []
    build:
      context: ..
      dockerfile: axiom-ason/Dockerfile
    environment:
      APEX_API_KEY: ${APEX_API_KEY:?Set APEX_API_KEY before starting the stack}
      APEX_URL: http://apex:8080
    depends_on:
      apex:
        condition: service_healthy

volumes:
  apex_data:
